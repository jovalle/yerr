version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - errcheck       # Check for unchecked errors
    - govet          # Vet examines Go source code and reports suspicious constructs
    - ineffassign    # Detect ineffectual assignments
    - staticcheck    # Go static analysis (includes gosimple in v2)
    - unused         # Check for unused constants, variables, functions and types
    - misspell       # Finds commonly misspelled English words in comments
    - goconst        # Finds repeated strings that could be replaced by a constant
    - gocyclo        # Computes cyclomatic complexity of functions
    - unconvert      # Remove unnecessary type conversions
    - unparam        # Reports unused function parameters
    - gocritic       # Highly extensible Go source code linter
    - revive         # Fast, configurable, extensible, flexible linter
    - gosec          # Inspects source code for security problems
    - bodyclose      # Checks whether HTTP response body is closed successfully
    - nilerr         # Finds code that returns nil even if it checks that error is not nil
    - predeclared    # Find code that shadows one of Go's predeclared identifiers
    - copyloopvar    # Checks for pointers to enclosing loop variables
    - whitespace     # Tool for detection of leading and trailing whitespace
    - bidichk        # Checks for dangerous unicode character sequences
    - contextcheck   # Check for misuse of context package
    - errname        # Checks that sentinel errors are prefixed with the Err
    - nilnil         # Checks for returning nil, nil
    - tparallel      # Detects inappropriate usage of t.Parallel() in tests
    - wastedassign   # Finds wasted assignment statements

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false

    govet:
      enable-all: true
      disable:
        - shadow
        - fieldalignment

    gocyclo:
      min-complexity: 15

    goconst:
      min-len: 3
      min-occurrences: 3

    misspell:
      locale: US

    lll:
      line-length: 120
      tab-width: 1

    unparam:
      check-exported: false

    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style

    revive:
      rules:
        - name: exported
          disabled: false
          arguments:
            - "checkPrivateReceivers"
            - "sayRepetitiveInsteadOfStutters"

    staticcheck:
      checks: ["all"]

  exclusions:
    rules:
      # Exclude some linters from running on test files
      - path: _test\.go
        linters:
          - gocyclo
          - errcheck
          - gosec
          - goconst
          - unparam

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
